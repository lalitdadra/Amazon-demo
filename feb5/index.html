<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Over Image</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="image-container">
        <div style="background-image:url(/feb11/pic-1.jpg);">
        <div class="image-text">
            <h1 style="position: absolute;">Hello World!</h1>
            <p style="position: absolute; ">This text is centered over the image.</p>
        </div>
    </div>
</body>
</html>
