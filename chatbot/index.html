<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<title>Chatbot</title>
<script src="./script.js" defer></script>
</head>

<body class="bg-black flex justify-center itmes-center">
    <div class="history absolute left-0 h-auto min-h-200 bg-white/20 rounded-xl p-2  w-[20%] m-5 text-white">
        <div class="bar flex justify-center bg-black rounded-xl p-2">History of Chat</div>
        <div class="text-white/50 ps-5 pt-2">Your Chat</div>
        <div id="history-bar" class=" mx-auto w-70 mt-2">
        </div>
    </div>
    <div class="left-150 main-box  text-white    w-230  min-h-210 max-h-auto bg-blue-200/10 p-2 mt-5 rounded-lg">
        <div class="icon top-0 w-5 h-5 animate-[spin_3s_ease-in-out_infinite] hover:scale-125">🤖
        </div>
            <div id="message">
                <div id="user"
                class="user-box ">
            </div>
            <div id="ai"
                class=" output ">
            </div>
            </div>
        <div>
        </div>
        <h1 id="container"></h1>
        <div class="flex border border-white/10 w-225 rounded-2xl   bg-white/10 text-white  mt-160 ">
            <div class="px-2 flex items-center ">
                <input
                    class="w-215 border-0 bg-transparent p-2 focus:outline-none focus:ring-0 focus:ring-offset-0 transition-all duration-300"
                    id="username" type="text" placeholder="Enter anything" />
                <button class="bg-white w-5 h-5 rounded-xl" id="btn" onclick="myfunc()"></button>
            </div>
        </div>
    </div>

</body>

</html>
