<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tailwind css</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="container  bg-black/65 text-white min-w-screen h-18">
        <div class="header flex items-center">
            <div class="box-1 flex m-4.5 gap-5 border-2 border-blue-500">
                <div class="inner-box-1-1 text-3xl">Google</div>
                <div class="inner-box-1-2 text-2xl">Research</div>

            </div>
            <div class="box-2 flex m-4.5 gap-5 border-2 border-blue-500 ">
                <div class="inner-box-2-1">hello world</div>
                <div class="inner-box-2-2">hi this is me</div>
                <div class="inner-box-2-3">inner box 2-3</div>
                <div class="inner-box-2-4">inner box 2-4</div>
            </div>
            <div class="box-3 flex m-4.5 border-2 border-blue-500">
                <div class="inner-box-3-1">welcome to tailwind css</div>
                <div class="inner-box-3-2">lets learn together</div>
            </div>
            <div class="box-4 flex m-4.5 border-2 border-blue-500">
                <div class="inner-box-4-1">this is box four</div>
                <div class="inner-box-4-2">tailwind is awesome</div>
            </div>

        </div>
    </div>

</body>

</html>
